<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Chat 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; overflow: hidden; }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    #info span { color: #a0c4ff; }
  </style>
</head>
<body>
  <div id="info">Chat 3D &mdash; <span>glisser</span> pour tourner &bull; <span>molette</span> pour zoomer</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ── Scene setup ─────────────────────────────────────── */
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);
    scene.fog = new THREE.Fog(0x1a1a2e, 18, 35);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 4, 10);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 4;
    controls.maxDistance = 20;
    controls.target.set(0, 1.5, 0);
    controls.update();

    /* ── Lights ──────────────────────────────────────────── */
    const ambient = new THREE.AmbientLight(0x404060, 1.2);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xfff0e0, 2.5);
    sun.position.set(5, 10, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 40;
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -8;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x8080ff, 0.6);
    fill.position.set(-4, 3, -4);
    scene.add(fill);

    const rim = new THREE.PointLight(0xff8844, 1.0, 20);
    rim.position.set(-3, 5, -5);
    scene.add(rim);

    /* ── Materials ───────────────────────────────────────── */
    const furMat    = new THREE.MeshStandardMaterial({ color: 0xd4925a, roughness: 0.85, metalness: 0.0 });
    const bellyMat  = new THREE.MeshStandardMaterial({ color: 0xf5d5aa, roughness: 0.9,  metalness: 0.0 });
    const darkMat   = new THREE.MeshStandardMaterial({ color: 0x8b5c2a, roughness: 0.9,  metalness: 0.0 });
    const eyeWhite  = new THREE.MeshStandardMaterial({ color: 0xf0f8ff, roughness: 0.3 });
    const eyePupil  = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.1 });
    const eyeIris   = new THREE.MeshStandardMaterial({ color: 0x22cc88, roughness: 0.3, metalness: 0.05 });
    const noseMat   = new THREE.MeshStandardMaterial({ color: 0xff7799, roughness: 0.6 });
    const whiskerMat= new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1.0 });
    const pawPad    = new THREE.MeshStandardMaterial({ color: 0xffaaaa, roughness: 0.8 });
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x23233a, roughness: 0.95 });

    /* ── Helper to make a mesh ───────────────────────────── */
    function mesh(geo, mat, { x=0, y=0, z=0, rx=0, ry=0, rz=0, sx=1, sy=1, sz=1, shadow=true } = {}) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.rotation.set(rx, ry, rz);
      m.scale.set(sx, sy, sz);
      if (shadow) { m.castShadow = true; m.receiveShadow = true; }
      return m;
    }

    /* ── Cat group ───────────────────────────────────────── */
    const cat = new THREE.Group();
    scene.add(cat);

    /* Body */
    const bodyGeo = new THREE.SphereGeometry(1.1, 32, 24);
    const body = mesh(bodyGeo, furMat, { y: 1.4, sx: 1.0, sy: 0.85, sz: 1.3 });
    cat.add(body);

    /* Belly patch */
    const bellyGeo = new THREE.SphereGeometry(0.7, 24, 20);
    const belly = mesh(bellyGeo, bellyMat, { y: 1.3, z: 0.95, sx: 0.9, sy: 0.65, sz: 0.35 });
    cat.add(belly);

    /* Neck */
    const neckGeo = new THREE.CylinderGeometry(0.42, 0.52, 0.5, 20);
    cat.add(mesh(neckGeo, furMat, { y: 2.3 }));

    /* Head */
    const headGeo = new THREE.SphereGeometry(0.75, 32, 24);
    const head = mesh(headGeo, furMat, { y: 3.0, sx: 1.05, sy: 1.0, sz: 1.0 });
    cat.add(head);

    /* Muzzle */
    const muzzleGeo = new THREE.SphereGeometry(0.35, 20, 16);
    cat.add(mesh(muzzleGeo, bellyMat, { y: 2.88, z: 0.6, sx: 1.1, sy: 0.75, sz: 0.7 }));

    /* Nose */
    const noseGeo = new THREE.SphereGeometry(0.085, 12, 10);
    cat.add(mesh(noseGeo, noseMat, { y: 2.98, z: 0.93, sx: 1.2, sy: 0.8 }));

    /* Ears */
    function makeEar(side) {
      const g = new THREE.ConeGeometry(0.28, 0.55, 4);
      const ear = mesh(g, furMat, {
        x: side * 0.45, y: 3.6, z: -0.12,
        rx: 0.1, rz: side * -0.18
      });
      cat.add(ear);

      // inner ear
      const ig = new THREE.ConeGeometry(0.16, 0.35, 4);
      const inner = mesh(ig, noseMat, {
        x: side * 0.45, y: 3.6, z: -0.09,
        rx: 0.1, rz: side * -0.18
      });
      cat.add(inner);
    }
    makeEar(-1); makeEar(1);

    /* Eyes */
    function makeEye(side) {
      // white
      const wg = new THREE.SphereGeometry(0.155, 20, 16);
      cat.add(mesh(wg, eyeWhite, { x: side * 0.27, y: 3.08, z: 0.65 }));
      // iris
      const ig = new THREE.SphereGeometry(0.12, 18, 14);
      cat.add(mesh(ig, eyeIris, { x: side * 0.27, y: 3.08, z: 0.75 }));
      // pupil (vertical slit)
      const pg = new THREE.SphereGeometry(0.08, 12, 10);
      cat.add(mesh(pg, eyePupil, { x: side * 0.27, y: 3.08, z: 0.8, sx: 0.35, sy: 1.0 }));
      // shine
      const sg = new THREE.SphereGeometry(0.03, 8, 8);
      const shine = mesh(sg, eyeWhite, { x: side * 0.27 + 0.03, y: 3.14, z: 0.83 });
      cat.add(shine);
    }
    makeEye(-1); makeEye(1);

    /* Whiskers */
    function makeWhisker(side, yOff, zRot) {
      const g = new THREE.CylinderGeometry(0.008, 0.004, 0.9, 6);
      const w = mesh(g, whiskerMat, {
        x: side * 0.55, y: 2.9 + yOff, z: 0.7,
        rx: Math.PI / 2, rz: zRot
      });
      cat.add(w);
    }
    makeWhisker(-1,  0.06, -0.22);
    makeWhisker(-1, -0.01,  0.0);
    makeWhisker(-1, -0.08,  0.22);
    makeWhisker( 1,  0.06,  0.22);
    makeWhisker( 1, -0.01,  0.0);
    makeWhisker( 1, -0.08, -0.22);

    /* Legs */
    function makeLeg(x, z, frontBack) {
      // upper leg
      const ug = new THREE.CapsuleGeometry(0.2, 0.45, 8, 12);
      cat.add(mesh(ug, furMat, { x, y: 0.85, z, rx: frontBack * 0.15 }));
      // paw
      const pg = new THREE.SphereGeometry(0.22, 16, 12);
      cat.add(mesh(pg, furMat, { x, y: 0.28, z: z + frontBack * 0.1, sx: 1.0, sy: 0.7, sz: 1.15 }));
      // paw pad
      const ppg = new THREE.SphereGeometry(0.13, 12, 10);
      cat.add(mesh(ppg, pawPad, { x, y: 0.15, z: z + frontBack * 0.15, sx: 0.9, sy: 0.4, sz: 0.9 }));
    }
    makeLeg(-0.55,  0.9,  1);
    makeLeg( 0.55,  0.9,  1);
    makeLeg(-0.52, -0.6, -1);
    makeLeg( 0.52, -0.6, -1);

    /* Tail */
    const tailCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3( 0.0, 1.1, -1.25),
      new THREE.Vector3(-0.5, 1.6, -1.7),
      new THREE.Vector3(-1.1, 2.5, -1.4),
      new THREE.Vector3(-0.9, 3.2, -0.8),
      new THREE.Vector3(-0.4, 3.5, -0.5),
    ]);
    const tailGeo = new THREE.TubeGeometry(tailCurve, 24, 0.12, 10, false);
    const tail = mesh(tailGeo, furMat);
    cat.add(tail);

    // tail tip (lighter)
    const tipGeo = new THREE.SphereGeometry(0.18, 14, 10);
    cat.add(mesh(tipGeo, bellyMat, { x: -0.4, y: 3.5, z: -0.5 }));

    /* Stripe markings on body */
    function addStripe(y, z, rz) {
      const g = new THREE.TorusGeometry(0.82, 0.055, 8, 36, Math.PI * 0.7);
      cat.add(mesh(g, darkMat, { y, z, rz }));
    }
    addStripe(1.65, 0.3, 0.2);
    addStripe(1.35, 0.4, 0.15);
    addStripe(1.05, 0.35, 0.1);

    /* ── Ground ──────────────────────────────────────────── */
    const groundGeo = new THREE.CircleGeometry(9, 64);
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    /* subtle grid */
    const grid = new THREE.GridHelper(18, 18, 0x333355, 0x2a2a44);
    grid.position.y = 0.01;
    scene.add(grid);

    /* ── Animate ─────────────────────────────────────────── */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // gentle idle breathing
      cat.scale.y = 1 + Math.sin(t * 1.4) * 0.012;
      cat.scale.x = 1 - Math.sin(t * 1.4) * 0.006;

      // slow tail wag (rotate whole cat slightly — tail follows)
      tail.rotation.y = Math.sin(t * 0.9) * 0.18;

      // slow head look
      head.rotation.y = Math.sin(t * 0.5) * 0.12;

      // blinking (every ~4 s)
      const blinkPhase = (t % 4.0) / 4.0;
      const blink = blinkPhase > 0.95 ? Math.sin((blinkPhase - 0.95) / 0.05 * Math.PI) : 0;
      head.scale.y = 1 - blink * 0.04;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    /* ── Resize ──────────────────────────────────────────── */
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
