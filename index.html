<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
  <title>Chat 3D</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#1a1a2e;overflow:hidden;touch-action:none}
    canvas{display:block}
    #info{position:absolute;top:16px;left:50%;transform:translateX(-50%);
      color:#ddd;font-family:-apple-system,sans-serif;font-size:14px;
      background:rgba(0,0,0,.55);padding:6px 16px;border-radius:20px;
      pointer-events:none;white-space:nowrap}
    #info b{color:#a0c4ff}
  </style>
</head>
<body>
  <div id="info"><b>1 doigt</b> tourner &bull; <b>2 doigts</b> zoomer</div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
  <script>

  /* --- Renderer --- */
  var R = new THREE.WebGLRenderer({ antialias: true });
  R.setPixelRatio(Math.min(devicePixelRatio, 2));
  R.setSize(innerWidth, innerHeight);
  R.shadowMap.enabled = true;
  document.body.appendChild(R.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);
  var cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);

  /* --- Lumieres --- */
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  var sun = new THREE.DirectionalLight(0xfff5d0, 2.0);
  sun.position.set(5, 10, 7);
  sun.castShadow = true;
  scene.add(sun);
  scene.add(Object.assign(new THREE.PointLight(0x4466ff, 1.2, 18), { position: new THREE.Vector3(-5, 8, -4) }));

  /* --- Materiaux simples (pas de textures lourdes) --- */
  var mFur   = new THREE.MeshLambertMaterial({ color: 0x8a6e42 });
  var mStripe= new THREE.MeshLambertMaterial({ color: 0x3a2010 });
  var mBelly = new THREE.MeshLambertMaterial({ color: 0xd4b882 });
  var mNose  = new THREE.MeshLambertMaterial({ color: 0xff7090 });
  var mEyeW  = new THREE.MeshLambertMaterial({ color: 0xf5f5ee });
  var mIris  = new THREE.MeshLambertMaterial({ color: 0x44cc66 });
  var mPupil = new THREE.MeshLambertMaterial({ color: 0x080808 });
  var mWhi   = new THREE.MeshLambertMaterial({ color: 0xdddddd });
  var mPaw   = new THREE.MeshLambertMaterial({ color: 0xffbbcc });
  var mDark  = new THREE.MeshLambertMaterial({ color: 0x1e0e04 });
  var mGnd   = new THREE.MeshLambertMaterial({ color: 0x23233a });

  /* --- Helpers --- */
  var cat = new THREE.Group();
  scene.add(cat);

  function mk(geo, mat, x, y, z, sx, sy, sz, rx, ry, rz) {
    var m = new THREE.Mesh(geo, mat);
    m.position.set(x || 0, y || 0, z || 0);
    m.scale.set(sx || 1, sy || 1, sz || 1);
    m.rotation.set(rx || 0, ry || 0, rz || 0);
    m.castShadow = true;
    cat.add(m);
    return m;
  }

  function tube(x1,y1,z1, x2,y2,z2, r, mat) {
    var va = new THREE.Vector3(x1,y1,z1);
    var vb = new THREE.Vector3(x2,y2,z2);
    var dir = new THREE.Vector3().subVectors(vb, va);
    var len = dir.length();
    if (len < 0.001) return null;
    var m = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.9, r, len, 10), mat);
    var mid = new THREE.Vector3().addVectors(va, vb).multiplyScalar(0.5);
    m.position.copy(mid);
    var up = new THREE.Vector3(0, 1, 0);
    var nd = dir.clone().normalize();
    if (Math.abs(nd.y) > 0.999) {
      m.rotation.x = nd.y < 0 ? Math.PI : 0;
    } else {
      m.quaternion.setFromUnitVectors(up, nd);
    }
    m.castShadow = true;
    cat.add(m);
    return m;
  }

  /* === CORPS === */
  mk(new THREE.SphereGeometry(1, 28, 20), mFur,   0, .88, 0,   1.0, .58, 1.8);
  mk(new THREE.SphereGeometry(.68,22,16), mBelly, 0, .68, .1,  .88, .46, 1.45);
  mk(new THREE.SphereGeometry(.68,22,16), mFur,   0, .92, .9,  .88, .76, .82);
  mk(new THREE.SphereGeometry(.64,22,16), mFur,   0, .83,-.88,  .9, .72, .8);
  // rayures corps
  mk(new THREE.SphereGeometry(.92,20,16), mStripe,0, .88, .15, 1.0, .55, .18);
  mk(new THREE.SphereGeometry(.88,20,16), mStripe,0, .88,-.3,  1.0, .55, .18);
  mk(new THREE.SphereGeometry(.84,20,16), mStripe,0, .85,-.72, 1.0, .55, .16);

  /* === COU === */
  tube(0, .96, .65,  0, 1.40, 1.10,  .30, mFur);

  /* === TETE === */
  var head = mk(new THREE.SphereGeometry(.62, 28, 20), mFur, 0, 1.60, 1.22, 1.08, .95, 1.0);
  mk(new THREE.SphereGeometry(.22,14,12), mFur, -.46, 1.50, 1.30, 1, .82, .74);
  mk(new THREE.SphereGeometry(.22,14,12), mFur,  .46, 1.50, 1.30, 1, .82, .74);
  mk(new THREE.SphereGeometry(.25,16,14), mBelly, 0, 1.47, 1.54, 1.05, .72, .65);
  mk(new THREE.SphereGeometry(.05,10, 8), mNose,  0, 1.56, 1.70, 1.2, .7, 1);
  // M sur le front
  mk(new THREE.SphereGeometry(.08,8,8), mStripe, -.18, 1.90, 1.08, 1,.4,1);
  mk(new THREE.SphereGeometry(.08,8,8), mStripe,  .18, 1.90, 1.08, 1,.4,1);
  mk(new THREE.SphereGeometry(.08,8,8), mStripe,  0,   1.92, 1.10, 1,.4,1);

  /* === OREILLES === */
  mk(new THREE.ConeGeometry(.22,.46,4), mFur,  -.34, 2.04, 1.08, 1,1,1,  .08,0,-.14);
  mk(new THREE.ConeGeometry(.12,.27,4), mNose, -.34, 2.04, 1.10, 1,1,1,  .08,0,-.14);
  mk(new THREE.ConeGeometry(.22,.46,4), mFur,   .34, 2.04, 1.08, 1,1,1,  .08,0, .14);
  mk(new THREE.ConeGeometry(.12,.27,4), mNose,  .34, 2.04, 1.10, 1,1,1,  .08,0, .14);

  /* === YEUX === */
  mk(new THREE.SphereGeometry(.112,18,14), mEyeW, -.22, 1.63, 1.48);
  mk(new THREE.SphereGeometry(.086,16,12), mIris, -.22, 1.63, 1.55);
  mk(new THREE.SphereGeometry(.058,10, 8), mPupil,-.22, 1.63, 1.59, .28, 1, 1);
  mk(new THREE.SphereGeometry(.016, 8, 6), mEyeW, -.20, 1.67, 1.62);
  mk(new THREE.SphereGeometry(.112,18,14), mEyeW,  .22, 1.63, 1.48);
  mk(new THREE.SphereGeometry(.086,16,12), mIris,  .22, 1.63, 1.55);
  mk(new THREE.SphereGeometry(.058,10, 8), mPupil, .22, 1.63, 1.59, .28, 1, 1);
  mk(new THREE.SphereGeometry(.016, 8, 6), mEyeW,  .24, 1.67, 1.62);

  /* === MOUSTACHES === */
  mk(new THREE.CylinderGeometry(.004,.003,.75,5), mWhi, -.46,1.49,1.45, 1,1,1, Math.PI/2,0,-.16);
  mk(new THREE.CylinderGeometry(.004,.003,.75,5), mWhi, -.46,1.49,1.45, 1,1,1, Math.PI/2,0, 0);
  mk(new THREE.CylinderGeometry(.004,.003,.75,5), mWhi, -.46,1.45,1.45, 1,1,1, Math.PI/2,0, .16);
  mk(new THREE.CylinderGeometry(.004,.003,.75,5), mWhi,  .46,1.49,1.45, 1,1,1, Math.PI/2,0, .16);
  mk(new THREE.CylinderGeometry(.004,.003,.75,5), mWhi,  .46,1.49,1.45, 1,1,1, Math.PI/2,0, 0);
  mk(new THREE.CylinderGeometry(.004,.003,.75,5), mWhi,  .46,1.45,1.45, 1,1,1, Math.PI/2,0,-.16);

  /* === PATTES (marche) === */
  // Avant gauche - avancee
  tube(-.42,.86,.68, -.42,.42,.90, .14, mFur);
  tube(-.42,.42,.90, -.42,.03,1.04, .11, mFur);
  mk(new THREE.SphereGeometry(.16,14,10), mFur, -.42,.10,1.06, 1,.6,1.1);
  mk(new THREE.SphereGeometry(.09, 8, 6), mPaw, -.42,.04,1.12, .9,.35,.85);
  mk(new THREE.SphereGeometry(.04, 6, 6), mPaw, -.475,.02,1.16);
  mk(new THREE.SphereGeometry(.04, 6, 6), mPaw,  -.42,.02,1.17);
  mk(new THREE.SphereGeometry(.04, 6, 6), mPaw, -.365,.02,1.16);
  // rayure patte
  mk(new THREE.SphereGeometry(.12,10, 8), mStripe,-.42,.65,.75, 1,1,.25);
  // Avant droite - reculee
  tube( .42,.90,.44,  .42,.46,.20, .14, mFur);
  tube( .42,.46,.20,  .42,.03,.06, .11, mFur);
  mk(new THREE.SphereGeometry(.16,14,10), mFur,  .42,.10,.04, 1,.6,1.1);
  mk(new THREE.SphereGeometry(.09, 8, 6), mPaw,  .42,.04,-.02, .9,.35,.85);
  mk(new THREE.SphereGeometry(.04, 6, 6), mPaw,  .475,.02,-.06);
  mk(new THREE.SphereGeometry(.04, 6, 6), mPaw,   .42,.02,-.07);
  mk(new THREE.SphereGeometry(.04, 6, 6), mPaw,  .365,.02,-.06);
  mk(new THREE.SphereGeometry(.12,10, 8), mStripe, .42,.68,.30, 1,1,.25);
  // Arriere gauche - reculee
  tube(-.40,.80,-.62, -.40,.36,-.90, .14, mFur);
  tube(-.40,.36,-.90, -.40,.03,-1.06, .11, mFur);
  mk(new THREE.SphereGeometry(.16,14,10), mFur, -.40,.10,-1.08, 1,.6,1.1);
  mk(new THREE.SphereGeometry(.09, 8, 6), mPaw, -.40,.04,-1.14, .9,.35,.85);
  mk(new THREE.SphereGeometry(.04, 6, 6), mPaw, -.455,.02,-1.18);
  mk(new THREE.SphereGeometry(.04, 6, 6), mPaw,  -.40,.02,-1.19);
  mk(new THREE.SphereGeometry(.04, 6, 6), mPaw, -.345,.02,-1.18);
  mk(new THREE.SphereGeometry(.12,10, 8), mStripe,-.40,.68,-.70, 1,1,.25);
  // Arriere droite - avance
  tube( .40,.83,-.47,  .40,.40,-.20, .14, mFur);
  tube( .40,.40,-.20,  .40,.03,-.06, .11, mFur);
  mk(new THREE.SphereGeometry(.16,14,10), mFur,  .40,.10,-.04, 1,.6,1.1);
  mk(new THREE.SphereGeometry(.09, 8, 6), mPaw,  .40,.04, .02, .9,.35,.85);
  mk(new THREE.SphereGeometry(.04, 6, 6), mPaw,  .455,.02,-.02);
  mk(new THREE.SphereGeometry(.04, 6, 6), mPaw,   .40,.02,-.01);
  mk(new THREE.SphereGeometry(.04, 6, 6), mPaw,  .345,.02,-.02);
  mk(new THREE.SphereGeometry(.12,10, 8), mStripe, .40,.68,-.52, 1,1,.25);

  /* === QUEUE === */
  var qp=[[0,.85,-1.0],[-.04,1.05,-1.32],[-.10,1.42,-1.56],
          [-.25,1.92,-1.66],[-.46,2.42,-1.52],[-.66,2.88,-1.22],
          [-.73,3.12,-.96],[-.62,3.32,-.78]];
  for (var i = 0; i < qp.length; i++) {
    var qmat = (i % 2 === 0) ? mFur : mDark;
    var qr = .09 - .009 * i;
    mk(new THREE.SphereGeometry(qr, 10, 8), qmat, qp[i][0], qp[i][1], qp[i][2]);
    if (i > 0) tube(qp[i-1][0],qp[i-1][1],qp[i-1][2], qp[i][0],qp[i][1],qp[i][2], qr + .01, qmat);
  }

  /* === SOL === */
  var gnd = new THREE.Mesh(new THREE.CircleGeometry(12, 40), mGnd);
  gnd.rotation.x = -Math.PI / 2;
  gnd.receiveShadow = true;
  scene.add(gnd);
  var grid = new THREE.GridHelper(24, 24, 0x2a2a45, 0x222238);
  grid.position.y = 0.005;
  scene.add(grid);

  /* === CAMERA === */
  var th=.5, ph=1.25, rd=11, tTh=.5, tPh=1.25, tRd=11;
  function updateCam() {
    cam.position.set(
      rd * Math.sin(ph) * Math.sin(th),
      2.2 + rd * Math.cos(ph),
      rd * Math.sin(ph) * Math.cos(th)
    );
    cam.lookAt(0, 1.2, 0);
  }
  updateCam();

  /* === CONTROLES === */
  var cv = R.domElement, drag = false, lx = 0, ly = 0, ld = 0;
  cv.addEventListener('mousedown', function(e){ drag=true; lx=e.clientX; ly=e.clientY; });
  window.addEventListener('mouseup', function(){ drag=false; });
  window.addEventListener('mousemove', function(e){
    if (!drag) return;
    tTh -= (e.clientX-lx)*.008;
    tPh = Math.max(.1, Math.min(Math.PI-.1, tPh-(e.clientY-ly)*.008));
    lx=e.clientX; ly=e.clientY;
  });
  cv.addEventListener('wheel', function(e){ tRd=Math.max(4,Math.min(20,tRd+e.deltaY*.015)); }, {passive:true});
  cv.addEventListener('touchstart', function(e){
    e.preventDefault();
    if (e.touches.length===1){ drag=true; lx=e.touches[0].clientX; ly=e.touches[0].clientY; }
    if (e.touches.length===2) ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  }, {passive:false});
  cv.addEventListener('touchmove', function(e){
    e.preventDefault();
    if (e.touches.length===1 && drag){
      tTh -= (e.touches[0].clientX-lx)*.008;
      tPh = Math.max(.1,Math.min(Math.PI-.1,tPh-(e.touches[0].clientY-ly)*.008));
      lx=e.touches[0].clientX; ly=e.touches[0].clientY;
    }
    if (e.touches.length===2){
      var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      tRd=Math.max(4,Math.min(20,tRd-(d-ld)*.05)); ld=d;
    }
  }, {passive:false});
  cv.addEventListener('touchend', function(){ drag=false; });

  /* === ANIMATION === */
  var clock = new THREE.Clock();
  (function loop(){
    requestAnimationFrame(loop);
    var t = clock.getElapsedTime(), k = .1;
    th += (tTh-th)*k; ph += (tPh-ph)*k; rd += (tRd-rd)*k;
    updateCam();
    cat.position.y = Math.sin(t*1.2)*.03;
    head.rotation.y = Math.sin(t*.5)*.08;
    R.render(scene, cam);
  })();

  window.addEventListener('resize', function(){
    cam.aspect = innerWidth/innerHeight;
    cam.updateProjectionMatrix();
    R.setSize(innerWidth, innerHeight);
  });

  </script>
</body>
</html>
