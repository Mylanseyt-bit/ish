<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Chat 3D</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#1a1a2e;overflow:hidden;touch-action:none}
    canvas{display:block}
    #info{
      position:absolute;top:18px;left:50%;transform:translateX(-50%);
      color:#eee;font-family:-apple-system,sans-serif;font-size:15px;
      pointer-events:none;white-space:nowrap;
      background:rgba(0,0,0,.5);padding:7px 18px;border-radius:20px;
    }
    #info b{color:#a0c4ff}
  </style>
</head>
<body>
  <div id="info"><b>Glisser</b> pour tourner &bull; <b>Pincer</b> pour zoomer</div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
  <script>

  /* ── Renderer ── */
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);

  const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
  camera.position.set(0, 3, 9);
  camera.lookAt(0, 2, 0);

  /* ── Lights ── */
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dir = new THREE.DirectionalLight(0xffeedd, 1.8);
  dir.position.set(5,10,5);
  dir.castShadow = true;
  scene.add(dir);
  scene.add(Object.assign(new THREE.DirectionalLight(0x6688ff,.5),{position: new THREE.Vector3(-4,4,-4)}));

  /* ── Materials ── */
  const fur    = new THREE.MeshLambertMaterial({color:0xd4925a});
  const belly  = new THREE.MeshLambertMaterial({color:0xf5d5aa});
  const dark   = new THREE.MeshLambertMaterial({color:0x8b5c2a});
  const eyeW   = new THREE.MeshLambertMaterial({color:0xffffff});
  const iris   = new THREE.MeshLambertMaterial({color:0x33dd99});
  const pupil  = new THREE.MeshLambertMaterial({color:0x111111});
  const nose   = new THREE.MeshLambertMaterial({color:0xff7799});
  const whi    = new THREE.MeshLambertMaterial({color:0xffffff});
  const pad    = new THREE.MeshLambertMaterial({color:0xffaaaa});

  /* ── Cat group ── */
  const cat = new THREE.Group();
  scene.add(cat);

  function mk(geo,mat,x,y,z,sx,sy,sz,rx,ry,rz){
    const m=new THREE.Mesh(geo,mat);
    m.position.set(x||0,y||0,z||0);
    m.scale.set(sx||1,sy||1,sz||1);
    m.rotation.set(rx||0,ry||0,rz||0);
    m.castShadow=true;
    cat.add(m);
    return m;
  }

  const S  = (r,w,h) => new THREE.SphereGeometry(r,w||24,h||18);
  const Cy = (rt,rb,h,s) => new THREE.CylinderGeometry(rt,rb,h,s||16);
  const Co = (r,h,s) => new THREE.ConeGeometry(r,h,s||4);

  // Body
  mk(S(.95),fur,  0,1.2,0,  1.05,.8,1.3);
  mk(S(.6), belly,0,1.1,.75, .9,.6,.3);

  // Neck
  mk(Cy(.38,.45,.45),fur, 0,2.1,0);

  // Head
  const head = mk(S(.7),fur, 0,2.75,0);

  // Muzzle
  mk(S(.32),belly, 0,2.63,.57, 1.05,.72,.65);

  // Nose
  mk(S(.07),nose, 0,2.72,.86, 1.1,.8,1);

  // Ears
  [-1,1].forEach(s=>{
    mk(Co(.25,.5,4),fur,   s*.38,3.27,-.1, 1,1,1, .1,0,s*-.15);
    mk(Co(.14,.3,4),nose,  s*.38,3.27,-.08,1,1,1, .1,0,s*-.15);
  });

  // Eyes
  [-1,1].forEach(s=>{
    mk(S(.14),eyeW, s*.24,2.82,.6);
    mk(S(.1), iris, s*.24,2.82,.7);
    mk(S(.07),pupil,s*.24,2.82,.75, .32,1,1);
    mk(S(.025),eyeW,s*.24+.025,2.86,.79);
  });

  // Whiskers
  [[-1,-.2,.05],[-1,.0,-.01],[-1,.2,-.07],
   [ 1,-.2,.05],[ 1,.0,-.01],[ 1,.2,-.07]]
  .forEach(([s,rz,dy])=>{
    const g=new THREE.CylinderGeometry(.006,.003,.8,5);
    mk(g,whi,s*.5,2.65+dy,.65, 1,1,1, Math.PI/2,0,rz);
  });

  // Legs (cylinder + sphere paw)
  [[-0.5,.8,1],[.5,.8,1],[-.48,-.55,-1],[.48,-.55,-1]]
  .forEach(([x,z,fb])=>{
    mk(Cy(.18,.2,.55),fur, x,.72,z, 1,1,1, fb*.12,0,0);
    mk(S(.2),fur,           x,.24,z+fb*.08, 1,.65,1.1);
    mk(S(.12),pad,          x,.14,z+fb*.12, .9,.38,.85);
  });

  // Tail (chain of cylinders)
  const tPts=[
    [0,1,-.9],[-.2,1.3,-1.2],[-.5,1.8,-1.4],
    [-.85,2.4,-1.2],[-.8,3.0,-.8],[-.45,3.3,-.5]
  ];
  for(let i=0;i<tPts.length-1;i++){
    const a=new THREE.Vector3(...tPts[i]);
    const b=new THREE.Vector3(...tPts[i+1]);
    const mid=new THREE.Vector3().addVectors(a,b).multiplyScalar(.5);
    const len=a.distanceTo(b);
    const r=.09-.012*i;
    const seg=new THREE.Mesh(Cy(r,r+.015,len,10),fur);
    seg.position.copy(mid);
    seg.castShadow=true;
    // orient along segment
    const axis=new THREE.Vector3(0,1,0);
    const dir2=new THREE.Vector3().subVectors(b,a).normalize();
    seg.quaternion.setFromUnitVectors(axis,dir2);
    cat.add(seg);
  }
  // tail tip
  mk(S(.13),belly, -.45,3.3,-.5);

  // Stripes
  [[1.45,.25,.18],[1.18,.3,.12],[.92,.28,.08]]
  .forEach(([y,z,rz])=>{
    mk(new THREE.TorusGeometry(.72,.045,6,32,Math.PI*.65),dark,0,y,z,1,1,1,0,0,rz);
  });

  /* ── Ground ── */
  const gnd=new THREE.Mesh(
    new THREE.CircleGeometry(9,48),
    new THREE.MeshLambertMaterial({color:0x23233a})
  );
  gnd.rotation.x=-Math.PI/2;
  gnd.receiveShadow=true;
  scene.add(gnd);

  /* ── Simple orbit (mouse + touch) ── */
  let theta=.3, phi=1.2, rad=9;
  let tTh=theta, tPh=phi, tRad=rad;
  function cam(){
    camera.position.set(
      rad*Math.sin(phi)*Math.sin(theta),
      2+rad*Math.cos(phi),
      rad*Math.sin(phi)*Math.cos(theta)
    );
    camera.lookAt(0,2,0);
  }
  cam();

  const cv=renderer.domElement;
  let drag=false,lx=0,ly=0,ld=0;
  cv.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
  window.addEventListener('mouseup',()=>drag=false);
  window.addEventListener('mousemove',e=>{
    if(!drag)return;
    tTh-=(e.clientX-lx)*.008; tPh=Math.max(.15,Math.min(Math.PI-.15,tPh-(e.clientY-ly)*.008));
    lx=e.clientX;ly=e.clientY;
  });
  cv.addEventListener('wheel',e=>{tRad=Math.max(4,Math.min(20,tRad+e.deltaY*.015));},{passive:true});
  cv.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(e.touches.length===1){drag=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}
    if(e.touches.length===2) ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  },{passive:false});
  cv.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===1&&drag){
      tTh-=(e.touches[0].clientX-lx)*.008;
      tPh=Math.max(.15,Math.min(Math.PI-.15,tPh-(e.touches[0].clientY-ly)*.008));
      lx=e.touches[0].clientX;ly=e.touches[0].clientY;
    }
    if(e.touches.length===2){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      tRad=Math.max(4,Math.min(20,tRad-(d-ld)*.05));ld=d;
    }
  },{passive:false});
  cv.addEventListener('touchend',()=>drag=false);

  /* ── Animate ── */
  const clock=new THREE.Clock();
  (function loop(){
    requestAnimationFrame(loop);
    const t=clock.getElapsedTime();
    const k=.1;
    theta+=(tTh-theta)*k; phi+=(tPh-phi)*k; rad+=(tRad-rad)*k;
    cam();
    cat.position.y=Math.sin(t*1.2)*.04;
    head.rotation.y=Math.sin(t*.6)*.1;
    renderer.render(scene,camera);
  })();

  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

  </script>
</body>
</html>
